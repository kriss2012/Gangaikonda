; Shadow Architecture (Virtual Shadow Maps for detailed scaffolding & carving penumbras)
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

; Anti-Aliasing (TSR for sharp architectural relief edges)
r.AntiAliasingMethod=4
r.TemporalAA.Upscaling=1

