r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=1
r.EyeAdaptation.CachedLightingPreExposure=8
r.DefaultFeature.Bloom=1
r.Tonemapper.Quality=4

; Frame-rate target (Doc 01 §35: 30 fps floor / 60 fps target)
t.MaxFPS=60
FrameRateLimit=60.0

