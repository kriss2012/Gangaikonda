; Global Illumination & Reflections (Lumen)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.DownsampleFactor=16

; Nanite Geometry System (Doc 17 & 19)
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=1.0

; Shadow Architecture (Virtual Shadow Maps for detailed scaffolding & carving penumbras)
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

; Anti-Aliasing (TSR for sharp architectural relief edges)
r.AntiAliasingMethod=4
r.TemporalAA.Upscaling=1

; Color & Exposure Pipeline (Doc 17 & 34)
; Physical exposure matching motivated lighting; motion blur off per accessibility Doc 37
r.DefaultFeature.MotionBlur=0
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=1
r.DefaultFeature.Bloom=1
r.Tonemapper.Quality=4

; Frame-rate target (Doc 01 §35: 30 fps floor / 60 fps target)
t.MaxFPS=60
FrameRateLimit=60.0
